name: Build resume.pdf

# Regenerates resume.pdf whenever the resume source changes,
# or when triggered manually, then commits the result.
on:
  push:
    branches: [main]
    paths:
      - "resume.html"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate or install Chrome
        id: chrome
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "Chrome not preinstalled — installing via @puppeteer/browsers ..."
            npx -y @puppeteer/browsers install chrome@stable --path "$HOME/chrome" >/dev/null
            CHROME_BIN="$(find "$HOME/chrome" -name chrome -type f | head -1)"
          fi
          echo "Using browser: $CHROME_BIN"
          echo "bin=$CHROME_BIN" >> "$GITHUB_OUTPUT"

      - name: Generate resume.pdf from resume.html
        run: |
          "${{ steps.chrome.outputs.bin }}" --headless=new --disable-gpu --no-sandbox \
            --no-pdf-header-footer \
            --print-to-pdf=resume.pdf \
            "file://$(pwd)/resume.html"
          ls -la resume.pdf

      - name: Commit updated PDF (if changed)
        run: |
          if git diff --quiet -- resume.pdf; then
            echo "PDF unchanged — nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add resume.pdf
            git commit -m "Auto-regenerate resume.pdf from resume.html [skip ci]"
            git push
          fi
